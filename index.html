<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #main {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px; /* Ограничиваем ширину карточки */
            width: 100%;
        }
        #form {
            display: none;
            text-align: center;

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .photo-caption {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }
        img {
            max-width: 100%; /* Картинка не будет шире контейнера */
            height: auto;
            border-radius: 4px;
            background-color: #eee; /* Цвет, пока грузится фото */
        }
        h2 {
            color: #222;
            margin-top: 15px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        input {
        box-sizing: border-box;
        padding: 14px 16px;
        font-size: 16px;
        color: #333;
        borer: 1px solid #ccc;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 15px;

    </style>
</head>
<body>
    <div id="main">
        <h1>Онлайн магазин</h1>

        <!-- Сюда вставляй путь к фото -->
        <img src="Spike_normal.png" alt="Фото товара">
        <div class="photo-caption">Фото товара</div>

        <h2>Товар</h2>
        <button type="submit" id="buy">Купить</button>

    </div>
    <form id="form">
        <input type="text" placeholder="Имя" id="username">
        <input type="text" placeholder="Email" id="mail">
        <input type="number" placeholder="Количество товара" id="count">
        <button type="submit" id="order">Оформить</button>
    </form>
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
    <script>
        let tg = window.Telegram.WebApp;
        let buy = document.getElementById('buy')
        let order = document.getElementById('order')
        buy.addEventListener("click", ()=>{
            document.getElementById('main'). style.display = "none";
            document.getElementById("form"). style.display = "block";
            document.getElementById("username").value = tg.initDataUnsafe.first_name;


        });
        document.getElementById("order").addEventListener("click", ()=>{
            tg.close();
        });
    </script>
</body>
</html>
